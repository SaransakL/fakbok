<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ฝากบอก "แอดมินฝากบอก"</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            min-height:100vh;

            background:#fff;

            display:flex;
            align-items:center;
            justify-content:center;

            font-family: "IBM Plex Sans Thai", sans-serif;
        }

        .wrapper{
            width:100%;
            max-width:900px;
            padding:20px;
            text-align:center;
        }

        .logo{
            width:100%;
            max-width:700px;

            animation: floating 4s ease-in-out infinite;
        }

        @keyframes floating{
            0%{
                transform:translateY(0);
            }
            50%{
                transform:translateY(-15px);
            }
            100%{
                transform:translateY(0);
            }
        }

        textarea{
            resize:none;
            min-height:200px;
            text-align: center;
        }

        .send-btn{

            padding:15px 30px;

            font-size:1.5rem;
            font-weight:bold;

            transition:.25s;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <img src="logo.png" class="logo mb-4" alt="logo">

    <div class="card-custom">

        <textarea
            class="form-control mb-4"
            id="message"
            placeholder="พิมพ์ข้อความที่ต้องการฝากบอก..."
        ></textarea>

        <button
            class="btn btn-primary send-btn"
            onclick="sendMessage()"
        >
            ส่งข้อความ
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
async function sendMessage(){

    const message =
    document.getElementById("message").value.trim();

    if(!message){

        Swal.fire({
            icon:"warning",
            title:"กรุณากรอกข้อความ"
        });

        return;
    }

    const webhook =
    "https://discord.com/api/webhooks/1516467499200413706/tQuOiRYOIEOo5loSJ7gK3IGyEbvIYYvHpmJu4jmMzyYl5vBSFitJ0SwUe7nvLQfBhJkD";

    try{

        await fetch(webhook,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({

                embeds:[
                    {
                        title:"ฝากบอกแอดมิน:",

                        description:message,

                        color:3447003,

                        timestamp:new Date()
                    }
                ]

            })
        });

        Swal.fire({
            icon:"success",
            title:"ส่งข้อความแล้ว"
        });

        document.getElementById("message").value="";

    }
    catch(error){

        Swal.fire({
            icon:"error",
            title:"ส่งไม่สำเร็จ"
        });

    }
}
</script>

</body>
</html>
