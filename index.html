<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ฝากบอก "แอดมินฝากบอก"</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ffffff;
}

.wrapper{
    width:100%;
    max-width:900px;
    padding:20px;
}

.logo{
    width:100%;
    max-width:700px;

    display:block;
    margin:auto;

    animation:floating 4s ease-in-out infinite;
}

@keyframes floating{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-15px);
    }

    100%{
        transform:translateY(0px);
    }

}

.card-custom{

    text-align:center;
}

#countdownBox{

    font-size:1.1rem;

    font-weight:600;

}

textarea{

    resize:none;
    text-align:center;

    font-size:2rem;
}

</style>
</head>
<body>

<div class="wrapper">

    <img src="logo.png" class="logo mb-4" alt="logo">

    <div class="card-custom">

        <div class="alert alert-danger mb-4" id="countdownBox">
            <span id="countdownText">กำลังโหลด...</span>
        </div>

        <textarea
            class="form-control mb-4"
            id="message"
            placeholder="พิมพ์ข้อความที่ต้องการฝากบอก..."
        ></textarea>

        <button
            class="btn btn-primary btn-lg send-btn"
            onclick="sendMessage()"
        >
            ส่งข้อความ
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>

const webhook =
"https://discord.com/api/webhooks/1516467499200413706/tQuOiRYOIEOo5loSJ7gK3IGyEbvIYYvHpmJu4jmMzyYl5vBSFitJ0SwUe7nvLQfBhJkD";

function getNextFriday20(){

    const now = new Date();

    const target = new Date(now);

    target.setHours(20,0,0,0);

    let diff = 5 - now.getDay();

    if(diff < 0){
        diff += 7;
    }

    target.setDate(now.getDate() + diff);

    if(
        now.getDay() === 5 &&
        now.getHours() >= 20
    ){
        target.setDate(target.getDate() + 7);
    }

    return target;
}

function isClosed(){

    const now = new Date();

    return (
        now.getDay() === 5 &&
        now.getHours() >= 20
    );
}

function updateCountdown(){

    const countdownText =
    document.getElementById("countdownText");

    const sendBtn =
    document.querySelector(".send-btn");

    if(isClosed()){

        countdownText.innerHTML =
        "ปิดรับข้อความแล้วครับ";

        sendBtn.disabled = true;

        return;
    }

    sendBtn.disabled = false;

    const target = getNextFriday20();

    const distance =
    target - new Date();

    const days =
    Math.floor(distance / (1000 * 60 * 60 * 24));

    const hours =
    Math.floor((distance / (1000 * 60 * 60)) % 24);

    const minutes =
    Math.floor((distance / (1000 * 60)) % 60);

    const seconds =
    Math.floor((distance / 1000) % 60);

    countdownText.innerHTML =
    `แอดมินจะปิดรับในอีก ${days} วัน ${hours} ชม. ${minutes} นาที ${seconds} วินาที`;
}

setInterval(updateCountdown,1000);
updateCountdown();

async function sendMessage(){

    if(isClosed()){

        Swal.fire({
            icon:"error",
            title:"ปิดรับข้อความแล้ว"
        });

        return;
    }

    const message =
    document.getElementById("message").value.trim();

    if(!message){

        Swal.fire({
            icon:"warning",
            title:"กรุณากรอกข้อความ"
        });

        return;
    }

    try{

        const response = await fetch(webhook,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                embeds:[
                    {
                        title:"ฝากบอกแอดมิน",
                        description:message,
                        color:3447003,
                        timestamp:new Date().toISOString()
                    }
                ]
            })
        });

        if(!response.ok){
            throw new Error();
        }

        Swal.fire({
            icon:"success",
            title:"ส่งข้อความเรียบร้อยแล้ว"
        });

        document.getElementById("message").value = "";

    }
    catch(error){

        Swal.fire({
            icon:"error",
            title:"ส่งข้อความไม่สำเร็จ"
        });

    }
}

</script>

</body>
</html>
